[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spantrail"
version = "0.1.0"
description = "Lightweight tracing and observability for AI agents."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SpanTrail" }]
keywords = ["observability", "tracing", "agents", "llm", "opentelemetry", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://spantrail.com"
Documentation = "https://spantrail.com/dashboard"
Source = "https://github.com/amlim13/spantrail"
Issues = "https://github.com/amlim13/spantrail/issues"

[tool.setuptools]
packages = ["spantrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
